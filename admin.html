<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản trị - Beloved Catholic Children</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#222;
}

header{
    background:linear-gradient(135deg,#8b0000,#d62828);
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    opacity:.9;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.box{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.login-box{
    max-width:450px;
    margin:50px auto;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:7px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.btn{
    background:#b00020;
    color:white;
}

.btn:hover{
    background:#8b0018;
}

.btn-secondary{
    background:#eee;
    color:#222;
}

.menu{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.menu button{
    background:#eee;
}

.menu button.active{
    background:#b00020;
    color:white;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

.image-box{
    border:2px dashed #ccc;
    padding:15px;
    border-radius:12px;
    background:#fafafa;
    margin-top:8px;
}

.upload-label{
    display:block;
    text-align:center;
    padding:14px;
    background:#b00020;
    color:white;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:12px;
}

.upload-label:hover{
    background:#8b0018;
}

#previewImage{
    width:100%;
    max-height:400px;
    object-fit:contain;
    margin-top:10px;
    border-radius:10px;
    background:#eee;
}

#uploadStatus{
    font-size:14px;
    margin:8px 0;
}

.post{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    background:white;
}

.post img{
    width:100%;
    max-height:300px;
    object-fit:contain;
    border-radius:10px;
    margin-top:10px;
}

.post h3{
    margin-top:0;
}

.post-date{
    font-size:13px;
    color:#777;
    margin-bottom:8px;
}

.logo-preview{
    max-width:250px;
    max-height:200px;
    object-fit:contain;
    display:block;
    margin:10px auto;
}

.hidden{
    display:none!important;
}

.error{
    color:#c00;
}

.success{
    color:green;
}

.logout{
    float:right;
    background:white;
    color:#b00020;
}

.clear{
    clear:both;
}

@media(max-width:600px){

    .container{
        padding:10px;
    }

    header h1{
        font-size:21px;
    }

    .menu button{
        flex:1 1 45%;
    }

}

</style>
</head>

<body>

<header>
    <button id="logoutBtn" class="logout hidden">

<!-- ĐĂNG NHẬP -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    push,
    remove,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


// ===============================
// FIREBASE CONFIG
// ===============================

const firebaseConfig = {

    apiKey:
        "AIzaSyA_b4h2_RP7vSMvM8eMxplFr7WSR2flzdg",

    authDomain:
        "beloved-catholic-children.firebaseapp.com",

    projectId:
        "beloved-catholic-children",

    storageBucket:
        "beloved-catholic-children.firebasestorage.app",

    messagingSenderId:
        "657011413453",

    appId:
        "1:657011413453:web:02fbdbd6ec8f5b04157484",

    measurementId:
        "G-VTL7T0S9EY"
};


// ===============================
// INIT
// ===============================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


// ===============================
// ELEMENTS
// ===============================

const loginArea =
    document.getElementById("loginArea");

const adminArea =
    document.getElementById("adminArea");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");


// ===============================
// LOGIN
// ===============================

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    if (!email || !password) {

        loginMessage.innerHTML =
            '<span class="error">Vui lòng nhập email và mật khẩu.</span>';

        return;
    }

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        loginMessage.innerHTML =
            '<span class="success">Đăng nhập thành công!</span>';

    } catch(error) {

        loginMessage.innerHTML =
            '<span class="error">Đăng nhập thất bại: ' +
            error.message +
            '</span>';

    }

});


// ===============================
// AUTH STATE
// ===============================

onAuthStateChanged(auth, user => {

    if(user){

        loginArea.classList.add("hidden");

        adminArea.classList.remove("hidden");

        logoutBtn.classList.remove("hidden");

        loadAll();

    }else{

        loginArea.classList.remove("hidden");

        adminArea.classList.add("hidden");

        logoutBtn.classList.add("hidden");

    }

});


// ===============================
// LOGOUT
// ===============================

logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

});


// ===============================
// MENU
// ===============================

document
.querySelectorAll(".menu button")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".menu button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        document
        .querySelectorAll(".panel")
        .forEach(panel =>
            panel.classList.remove("active")
        );

        button.classList.add("active");

        document
        .getElementById(button.dataset.panel)
        .classList.add("active");

    });

});


// ===============================
// ẢNH
// ===============================

let selectedImageData = "";

const imageInput =
    document.getElementById("imageInput");

const newsImage =
    document.getElementById("newsImage");

const previewImage =
    document.getElementById("previewImage");

const uploadStatus =
    document.getElementById("uploadStatus");


// ===============================
// CHỌN ẢNH TỪ MÁY
// ===============================

imageInput.addEventListener(
"change",
function(){

    const file = this.files[0];

    if(!file) return;


    if(!file.type.startsWith("image/")){

        alert("Vui lòng chọn file hình ảnh!");

        this.value = "";

        return;
    }


    /*
      Giới hạn 1.5MB
      để tránh bài viết quá lớn
    */

    if(file.size > 1.5 * 1024 * 1024){

        alert(
            "Ảnh quá lớn! Hãy chọn ảnh dưới 1.5MB."
        );

        this.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
    function(e){

        selectedImageData =
            e.target.result;

        previewImage.src =
            selectedImageData;

        previewImage.style.display =
            "block";

        newsImage.value =
            "";

        uploadStatus.innerHTML =
            '<span class="success">✅ Đã chọn ảnh</span>';

    };


    reader.readAsDataURL(file);

});


// ===============================
// DÁN LINK ẢNH
// ===============================

newsImage.addEventListener(
"input",
function(){

    const url =
        this.value.trim();


    if(!url){

        if(!selectedImageData){

            previewImage.style.display =
                "none";

        }

        return;
    }


    selectedImageData = "";


    previewImage.src = url;

    previewImage.style.display =
        "block";


    previewImage.onload =
    function(){

        uploadStatus.innerHTML =
            '<span class="success">✅ Link ảnh hợp lệ</span>';

    };


    previewImage.onerror =
    function(){

        uploadStatus.innerHTML =
            '<span class="error">❌ Không thể tải ảnh từ link này</span>';

    };

});


// ===============================
// ĐĂNG BÀI
// ===============================

document
.getElementById("addNews")
.addEventListener("click", async () => {

    const title =
        document
        .getElementById("newsTitle")
        .value
        .trim();

    const content =
        document
        .getElementById("newsContent")
        .value
        .trim();

    const image =
        selectedImageData ||
        document
        .getElementById("newsImage")
        .value
        .trim();


    if(!title){

        alert("Vui lòng nhập tiêu đề!");

        return;
    }


    if(!content){

        alert("Vui lòng nhập nội dung!");

        return;
    }


    try{

        const postRef =
            push(ref(db,"posts"));


        await set(postRef, {

            title: title,

            content: content,

            image: image,

            date:
                new Date()
                .toISOString()

        });


        alert("✅ Đăng bài thành công!");


        // RESET

        document
        .getElementById("newsTitle")
        .value = "";

        document
        .getElementById("newsContent")
        .value = "";

        document
        .getElementById("newsImage")
        .value = "";

        document
        .getElementById("imageInput")
        .value = "";

        selectedImageData = "";

        previewImage.src = "";

        previewImage.style.display =
            "none";

        uploadStatus.innerHTML = "";


    }catch(error){

        alert(
            "❌ Không thể đăng bài: " +
            error.message
        );

    }

});


// ===============================
// LOAD ALL
// ===============================

function loadAll(){

    loadHome();

    loadAbout();

    loadNews();

    loadActivity();

    loadMusic();

    loadContact();

    loadLogo();

}


// ===============================
// HOME
// ===============================

function loadHome(){

    onValue(
        ref(db,"siteContent/home"),
        snapshot => {

            const data =
                snapshot.val();

            if(!data) return;

            document
            .getElementById("homeTitle")
            .value =
                data.title || "";

            document
            .getElementById("homeContent")
            .value =
                data.content || "";

        }
    );

}


document
.getElementById("saveHome")
.addEventListener("click", async () => {

    const title =
        document
        .getElementById("homeTitle")
        .value;

    const content =
        document
        .getElementById("homeContent")
        .value;

    try{

        await set(
            ref(db,"siteContent/home"),
            {
                title,
                content
            }
        );

        alert("✅ Đã lưu trang chủ!");

    }catch(error){

        alert(error.message);

    }

});


// ===============================
// ABOUT
// ===============================

function loadAbout(){

    onValue(
        ref(db,"siteContent/about"),
        snapshot => {

            const data =
                snapshot.val();

            if(!data) return;

            document
            .getElementById("aboutContent")
            .value =
                data.content || "";

        }
    );

}


document
.getElementById("saveAbout")
.addEventListener("click", async () => {

    const content =
        document
        .getElementById("aboutContent")
        .value;

    try{

        await set(
            ref(db,"siteContent/about"),
            {
                content
            }
        );

        alert("✅ Đã lưu giới thiệu!");

    }catch(error){

        alert(error.message);

    }

});


// ===============================
// NEWS LIST
// ===============================

function loadNews(){

    onValue(
        ref(db,"posts"),
        snapshot => {

            const newsList =
                document.getElementById("newsList");

            newsList.innerHTML = "";


            const data =
                snapshot.val();


            if(!data){

                newsList.innerHTML =
                    "<p>Chưa có bài viết.</p>";

                return;
            }


            const posts =
                Object.entries(data)
                .reverse();


            posts.forEach(
            ([id,post]) => {

                const div =
                    document.createElement("div");

                div.className =
                    "post";


                let imageHTML = "";


                if(post.image){

                    imageHTML =
                    `
                    <img
                        src="${escapeHTML(post.image)}"
                        onerror="this.style.display='none'"
                    >
                    `;

                }


                div.innerHTML =
                `
                    <h3>
                        ${escapeHTML(post.title || "")}
                    </h3>

                    <div class="post-date">
                        ${formatDate(post.date)}
                    </div>

                    <p>
                        ${escapeHTML(post.content || "")}
                    </p>

                    ${imageHTML}

                    <br>

                    <button
                        class="btn"
                        data-delete="${id}"
                    >
                        🗑️ Xóa bài
                    </button>
                `;


                newsList.appendChild(div);


                div
                .querySelector("[data-delete]")
                .addEventListener(
                    "click",
                    () => deleteNews(id)
                );

            });

        }
    );

}


// ===============================
// DELETE NEWS
// ===============================

async function deleteNews(id){

    const ok =
        confirm(
            "Bạn có chắc muốn xóa bài viết này?"
        );


    if(!ok) return;


    try{

        await remove(
            ref(db,"posts/" + id)
        );

        alert("✅ Đã xóa bài!");

    }catch(error){

        alert(
            "❌ Không thể xóa: " +
            error.message
        );

    }

}

document

.addEventListener("click", async () => {

    try{

        await set(
            ref(db,"siteContent/contact"),
            {

                content:
                    document
                    .getElementById("contactContent")
                    .value

            }
        );

        alert("✅ Đã lưu liên hệ!");

    }catch(error){

        alert(error.message);

    }

});


// ===============================
// LOGO
// ===============================

function loadLogo(){

    onValue(
        ref(db,"siteContent/logo"),
        snapshot => {

            const data =
                snapshot.val();

            if(!data) return;

            const url =
                data.url || "";

            document
            .getElementById("logoUrl")
            .value = url;


            if(url){

                document
                .getElementById("logoPreview")
                .src = url;

                document
                .getElementById("logoPreview")
                .style.display =
                    "block";

            }

        }
    );

}


document
.getElementById("logoUrl")
.addEventListener("input", () => {

    const url =
        document
        .getElementById("logoUrl")
        .value
        .trim();


    const preview =
        document
        .getElementById("logoPreview");


    if(url){

        preview.src = url;

        preview.style.display =
            "block";

    }else{

        preview.style.display =
            "none";

    }

});


document
.getElementById("saveLogo")
.addEventListener("click", async () => {

    const url =
        document
        .getElementById("logoUrl")
        .value
        .trim();


    try{

        await set(
            ref(db,"siteContent/logo"),
            {
                url
            }
        );

        alert("✅ Đã lưu logo!");

    }catch(error){

        alert(error.message);

    }

});


// ===============================
// HỖ TRỢ
// ===============================

function formatDate(date){

    if(!date) return "";

    try{

        return new Date(date)
        .toLocaleString("vi-VN");

    }catch{

        return date;

    }

}


function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
