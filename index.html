<div id="logo" class="panel">
  <div class="box">
    <h2>🖼️ Logo Hội</h2>

    <img id="logoPreview"
         src="https://i.imgur.com/ySE4ioP.png"
         alt="Logo"
         style="display:block;width:220px;height:220px;object-fit:contain;margin:15px auto;border-radius:12px;">

    <input type="file"
           id="logoInput"
           accept="image/*"
           style="width:100%;margin-top:10px;">

    <p id="logoStatus" style="text-align:center;"></p>
  </div>
</div>

<script>
const logoInput = document.getElementById("logoInput");
const logoPreview = document.getElementById("logoPreview");
const logoStatus = document.getElementById("logoStatus");

logoInput.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (e) {
    logoPreview.src = e.target.result;
    logoStatus.textContent = "✅ Đã chọn logo mới";
  };

  reader.readAsDataURL(file);
});
</script>
